# Estava deployada com verify_jwt=false e FORA deste arquivo (17/08/2026): registrado
# aqui pra um deploy a partir do repo nao inverter o flag sem ninguem perceber. A
# funcao exige Authorization e valida o usuario por getUser(), entao a checagem de
# quem chama nao depende do gateway.
[functions.adopt-device]
verify_jwt = false

# Cadastro publico: quem chama e um visitante anonimo na tela de login.
[functions.signup-publico]
verify_jwt = false

[functions.join-request]
verify_jwt = true

# Funil do site comercial. O codigo delas vivia so no Supabase; trazido para o
# repo em 29/07/2026 junto com a correcao da reserva de documento (v2).
[functions.start-free-prod]
verify_jwt = false

[functions.start-trial-prod]
verify_jwt = false

# Slot de anuncio do plano gratuito (Fase 1). Quem chama e o painel logado, com o
# JWT do tecnico — e o proprio user_id que vira o espectador da impressao e o
# sujeito do teto diario. Sem gateway exigindo JWT, uma chamada anonima entraria
# na funcao e so seria barrada la dentro; pior, um caller sem sessao nao tem
# espectador nenhum a quem atribuir a exibicao. Por isso true, ao contrario da
# maioria das funcoes deste arquivo.
[functions.ad-serve]
verify_jwt = true
